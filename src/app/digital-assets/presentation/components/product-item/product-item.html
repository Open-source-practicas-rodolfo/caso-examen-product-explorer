<mat-card class="product-card" tabindex="0" [attr.aria-label]="'Card for ' + product().title">

  <img mat-card-image [src]="product().image" [alt]="'Image of ' + product().title" class="product-image">

  <mat-card-header>
    <mat-card-title>{{ product().title }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <p class="description">{{ product().description }}</p>
    <p><strong>{{ 'product.category' | translate }}:</strong> {{ product().category }}</p>
    <p><strong>{{ 'product.price' | translate }}:</strong> ${{ product().price }}</p>
    <p><strong>{{ 'product.rating' | translate }}:</strong> ⭐ {{ product().rating }}</p>
  </mat-card-content>

  <mat-card-actions>
    <a mat-button color="primary" [attr.aria-label]="'View details for ' + product().title" [href]="'https://dummyjson.com/products/' + product().id" target="_blank">
      {{ 'product.details' | translate }}
    </a>
  </mat-card-actions>
</mat-card>
